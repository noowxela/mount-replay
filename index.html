<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mount Kinabalu · Hike replay</title>
  <meta name="description" content="A 3D replay of the two-day Mount Kinabalu climb from Timpohon Gate to Low's Peak (4,095 m), with your own photos placed on the trail. Copernicus GLO-30 terrain, OpenStreetMap trail." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Mount Kinabalu" />
  <meta property="og:title" content="Mount Kinabalu · Hike replay" />
  <meta property="og:description" content="A 3D replay of the two-day Mount Kinabalu climb from Timpohon Gate to Low's Peak (4,095 m), with your own photos placed on the trail." />
  <meta property="og:url" content="https://noowxela.github.io/mount-replay/" />
  <meta property="og:image" content="https://noowxela.github.io/mount-replay/og.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="3D terrain of Mount Kinabalu with the summit trail from Timpohon Gate to Low's Peak." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Mount Kinabalu · Hike replay" />
  <meta name="twitter:description" content="A 3D replay of the two-day Mount Kinabalu climb from Timpohon Gate to Low's Peak (4,095 m), with your own photos placed on the trail." />
  <meta name="twitter:image" content="https://noowxela.github.io/mount-replay/og.png" />
  <meta name="twitter:image:alt" content="3D terrain of Mount Kinabalu with the summit trail from Timpohon Gate to Low's Peak." />
</head>
<body>
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 16" width="18" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 14.5 L6.2 8.2 L9.2 11 L14.2 2.2 L16.4 6.2 L19 4.4 L23 14.5"/></svg></span><b data-i="title"></b><span class="sub" data-i="subtitle"></span></div>
    <div class="langs" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="zh">中文</button><button data-lang="ms">BM</button></div>
  </header>
  <main class="layout aside-closed">
    <section class="stage" aria-label="3D terrain">
      <div id="gl"></div>
      <div id="labels" aria-hidden="true"></div>
      <div class="overlay tl">
        <div class="tagline" data-i="tagline"></div>
        <div class="views" role="group"><button data-view="auto"></button><button data-view="follow"></button><button data-view="oblique"></button><button data-view="top"></button><button data-view="reset"></button></div>
        <div class="tone" role="group"><button id="btn-colour"></button><button id="btn-mono"></button></div>
      </div>
      <div class="overlay bl hint" data-i="hint"></div>
      <div id="night" class="night hidden" role="status"><div class="night-t" data-i="night"></div><div class="night-x" data-i="nightText"></div><button id="night-skip" data-i="skip"></button></div>
      <div id="loading" class="loading" data-i="loading"></div>
      <button type="button" id="aside-tab" class="aside-tab" aria-expanded="false" aria-controls="side"><svg class="aside-chev" viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M4.5 2.5 L8 6 L4.5 9.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="aside-word">info</span></button>
    </section>
    <aside class="side" id="side">
      <section class="panel live"><h2><span class="num">01</span> <span data-i="live"></span> <span class="badge" data-i="typical"></span></h2>
        <div class="kv"><div><span data-i="clock"></span><b id="v-clock">–</b><i id="v-day"></i></div><div><span data-i="elevation"></span><b id="v-ele">–</b></div><div><span data-i="distance"></span><b id="v-dist">–</b></div><div><span data-i="elapsed"></span><b id="v-elapsed">–</b></div></div>
        <p class="note" data-i="typicalNote"></p></section>
      <section class="panel cps"><h2><span class="num">02</span> <span data-i="checkpoints"></span></h2><ol id="cp-list"></ol></section>
      <section class="panel media"><h2><span class="num">05</span> <span data-i="media"></span></h2>
        <label class="file"><input id="file" type="file" accept="image/*,video/*,.heic,.heif,.mov" multiple /><span data-i="addMedia"></span></label> <button id="clear-media" class="clear-media" data-i="clearMedia"></button>
        <div id="media-progress" class="media-progress mono hidden" role="status" aria-live="polite"></div>
        <p class="note" data-i="mediaNote"></p>
        <p id="media-store" class="note store-warn hidden" role="status"></p>
        <p id="media-hint" class="note hint-gps hidden" role="note"></p>
        <div class="media-ctl"><label><span data-i="mediaDay1"></span> <input id="day1" type="date" /></label><label><span data-i="mediaOffset"></span> <input id="offset" type="number" step="0.5" value="0" min="-14" max="14" /></label></div>
        <ul id="media-list"></ul></section>
      <section class="panel loc"><h2><span class="num">04</span> <span data-i="location"></span></h2><svg id="inset" role="img"></svg><div id="loc-coords" class="mono"></div></section>
      <section class="panel credits"><h2><span class="num">06</span> <span data-i="credits"></span></h2><ul id="sources"></ul></section>
    </aside>
    <section class="bottom mono chart-closed">
      <button type="button" id="bottom-tab" class="bottom-tab" aria-expanded="false" aria-controls="chart" aria-label="Elevation profile"><svg class="bottom-chev" viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M2.5 4.5 L6 8 L9.5 4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="ch-head">
        <div class="ch-l">
          <h2 class="ch-title"><span class="num">03</span> / <span data-i="elevation"></span> · <span id="chapter" class="chapter"></span></h2>
          <div class="ch-btns"><button id="btn-back">← <span data-i="back"></span></button><button id="btn-next"><span data-i="next"></span> →</button><button id="btn-trace" aria-pressed="false">⌖ <span data-i="trace"></span></button></div>
        </div>
        <div class="ch-r"><div><span id="ch-prog">0%</span> · <span id="t-now">00:00</span></div><div class="ch-hint" data-i="stopsHint"></div></div>
      </div>
      <svg id="chart" aria-label="Elevation profile"></svg>
      <div class="transport">
        <button id="play" class="play"><span id="play-ico">▶</span> <span id="play-txt"></span></button>
        <input id="scrub" type="range" min="0" max="1000" step="1" value="0" aria-label="Timeline" />
        <label class="speed"><span class="sr" data-i="speed"></span><select id="speed"><option value="30">30 ×</option><option value="60">60 ×</option><option value="120">120 ×</option><option value="240">240 ×</option><option value="600" selected>600 ×</option><option value="1200">1200 ×</option><option value="2400">2400 ×</option></select></label>
        <button id="loop" class="loop" aria-pressed="true">↻ <span data-i="loop"></span></button>
      </div>
    </section>
  </main>
  <div id="viewer" class="viewer hidden" role="dialog" aria-modal="true"><div class="vbox"><button id="viewer-close" data-i="close"></button><div id="viewer-body"></div><div id="viewer-cap" class="mono"></div></div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
